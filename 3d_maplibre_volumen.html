<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kreis 4 – 3D Volumen</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #map { height: 100%; width: 100%; }
    .hud{ position:absolute; z-index:10; left:14px; top:14px; background:rgba(255,255,255,.96); padding:12px 14px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.14); max-width:430px; }
    .hud h1{ margin:0 0 4px 0; font-size:20px; }
    .hud p{ margin:0; color:#555; font-size:13px; line-height:1.35; }
    .buttons{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    button{ border:0; border-radius:10px; padding:8px 10px; background:#111827; color:#fff; cursor:pointer; font-size:13px; }
    button.secondary{ background:#f3f4f6; color:#111827; border:1px solid #d1d5db; }
    .maplibregl-popup-content { font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; border-radius:10px; padding:12px 14px; min-width:270px; }
    .popup-title { font-weight:700; margin-bottom:6px; font-size:15px; }
    .popup-row { margin:2px 0; }
    .popup-key { color:#666; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hud">
    <h1>Kreis 4 – 3D Volumen</h1>
    <p>3D-Gebäudevolumen aus der Basemap, deine Punkte mit Popups darüber. Ohne weitere Prozesse.</p>
    <div class="buttons">
      <button id="togglePoints">Punkte ausblenden</button>
      <button id="toggleBuildings" class="secondary">3D Volumen ausblenden</button>
      <button id="resetView" class="secondary">Ansicht zurücksetzen</button>
    </div>
  </div>
  <script>
    const CENTER = [8.531, 47.377];
    const START = { center: CENTER, zoom: 15.8, pitch: 60, bearing: -20 };
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/bright",
      center: START.center, zoom: START.zoom, pitch: START.pitch, bearing: START.bearing, antialias: true
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");
    let pointsVisible = true, buildingsVisible = true;

    map.on("load", () => {
      const layers = map.getStyle().layers || [];
      let labelLayerId = null;
      for (const layer of layers) {
        if (layer.type === "symbol" && layer.layout && layer.layout["text-field"]) { labelLayerId = layer.id; break; }
      }
      if (!map.getSource("openfreemap")) {
        map.addSource("openfreemap", { type: "vector", url: "https://tiles.openfreemap.org/planet" });
      }
      map.addLayer({
        id: "3d-buildings",
        source: "openfreemap",
        "source-layer": "building",
        type: "fill-extrusion",
        minzoom: 15,
        filter: ["!=", ["get", "hide_3d"], true],
        paint: {
          "fill-extrusion-color": ["case", ["has", "building:colour"], ["get", "building:colour"], "#d6d3d1"],
          "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 15, 0, 16, ["coalesce", ["get", "render_height"], 14]],
          "fill-extrusion-base": ["case", [">=", ["zoom"], 16], ["coalesce", ["get", "render_min_height"], 0], 0],
          "fill-extrusion-opacity": 0.92
        }
      }, labelLayerId || undefined);

      map.addSource("kreis4-boundary", { type: "geojson", data: "assets/kreis4_boundary.geojson" });
      map.addLayer({ id: "kreis4-boundary-line", type: "line", source: "kreis4-boundary", paint: { "line-color": "#dc2626", "line-width": 3 } });

      map.addSource("kreis4-points", { type: "geojson", data: "assets/points.geojson" });
      map.addLayer({ id: "kreis4-points-halo", type: "circle", source: "kreis4-points", paint: { "circle-radius": 11, "circle-color": "rgba(255,138,0,0.12)", "circle-stroke-width": 0 } });
      map.addLayer({ id: "kreis4-points-circle", type: "circle", source: "kreis4-points", paint: { "circle-radius": 6, "circle-color": "#ff8a00", "circle-stroke-color": "#1f2937", "circle-stroke-width": 1.2 } });

      map.on("mouseenter", "kreis4-points-circle", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "kreis4-points-circle", () => { map.getCanvas().style.cursor = ""; });

      map.on("click", "kreis4-points-circle", (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        const p = f.properties || {};
        const title = [p.strasse, p.hausnummer].filter(Boolean).join(" ").trim() || "Gebäude";
        const html = `
          <div class="popup-title">${esc(title)}</div>
          <div class="popup-row"><span class="popup-key">EGID:</span> ${esc(p.egid)}</div>
          <div class="popup-row"><span class="popup-key">Baujahr:</span> ${esc(p.baujahr)}</div>
          <div class="popup-row"><span class="popup-key">Grundfläche:</span> ${esc(p.grundflaeche_m2)} m²</div>
          <div class="popup-row"><span class="popup-key">Nutzung:</span> ${esc(p.gebaeude_nutzung)}</div>
          <div class="popup-row"><span class="popup-key">Qualität:</span> ${esc(p.qualitaet)}</div>
          <div class="popup-row"><span class="popup-key">PLZ / Ort:</span> ${esc(p.plz)} ${esc(p.ortschaft)}</div>
        `;
        new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: "340px" }).setLngLat(e.lngLat).setHTML(html).addTo(map);
      });

      fetch("assets/kreis4_boundary.geojson").then(r => r.json()).then(gj => {
        if (!gj || !gj.features || !gj.features.length) return;
        const bounds = new maplibregl.LngLatBounds();
        const addCoords = coords => coords.forEach(c => Array.isArray(c[0]) ? addCoords(c) : bounds.extend(c));
        gj.features.forEach(f => addCoords(f.geometry.coordinates));
        if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 40, duration: 0, pitch: START.pitch, bearing: START.bearing });
      }).catch(() => {});
    });

    document.getElementById("togglePoints").addEventListener("click", () => {
      pointsVisible = !pointsVisible;
      const vis = pointsVisible ? "visible" : "none";
      if (map.getLayer("kreis4-points-circle")) map.setLayoutProperty("kreis4-points-circle", "visibility", vis);
      if (map.getLayer("kreis4-points-halo")) map.setLayoutProperty("kreis4-points-halo", "visibility", vis);
      document.getElementById("togglePoints").textContent = pointsVisible ? "Punkte ausblenden" : "Punkte einblenden";
    });
    document.getElementById("toggleBuildings").addEventListener("click", () => {
      buildingsVisible = !buildingsVisible;
      const vis = buildingsVisible ? "visible" : "none";
      if (map.getLayer("3d-buildings")) map.setLayoutProperty("3d-buildings", "visibility", vis);
      document.getElementById("toggleBuildings").textContent = buildingsVisible ? "3D Volumen ausblenden" : "3D Volumen einblenden";
    });
    document.getElementById("resetView").addEventListener("click", () => {
      map.easeTo({ center: START.center, zoom: START.zoom, pitch: START.pitch, bearing: START.bearing, duration: 900 });
    });
  </script>
</body>
</html>
