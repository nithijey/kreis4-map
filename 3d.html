<!doctype html><html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Kreis 4 – 3D</title><style>html,body{height:100%;margin:0;overflow:hidden}#c{width:100%;height:100%;display:block}#hud{position:fixed;left:12px;top:12px;z-index:10;background:rgba(255,255,255,.9);padding:10px 12px;border-radius:10px;max-width:420px;box-shadow:0 6px 18px rgba(0,0,0,.12)}#popup{position:fixed;right:12px;top:12px;z-index:10;background:rgba(255,255,255,.95);padding:12px 14px;border-radius:10px;max-width:420px;max-height:80vh;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12);display:none}td{padding:2px 6px;vertical-align:top}td:first-child{color:#555}button{cursor:pointer}</style></head><body><canvas id="c"></canvas><div id="hud"><b>Kreis 4 – 3D</b><div style="color:#666;font-size:12px;margin-top:4px">Klicke eine Kugel für Infos.</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button id="toggleS">Kugeln ausblenden</button><button id="closeP">Popup schliessen</button></div></div><div id="popup"></div><script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const canvas=document.querySelector('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfdfff);
const camera=new THREE.PerspectiveCamera(55,2,0.1,200000);
camera.position.set(0,-2500,1800);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,200);
controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const dir=new THREE.DirectionalLight(0xffffff,0.8);dir.position.set(1500,-1500,2000);scene.add(dir);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(12000,12000),new THREE.MeshStandardMaterial({color:0xf5f5f5}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const loader=new GLTFLoader();
loader.load('assets/buildings_simple.glb',(g)=>{scene.add(g.scene);},undefined,(e)=>console.error(e));
const spheres=[];const group=new THREE.Group();scene.add(group);
const sGeom=new THREE.SphereGeometry(8,16,16);
const sMat=new THREE.MeshStandardMaterial({color:0xff8a00});
const popup=document.getElementById('popup');
function makeTable(p){
 const keys=['strasse','hausnummer','plz','ortschaft','baujahr','grundflaeche_m2','gebaeudealter_2026','gebaeude_nutzung','qualitaet','oew_typ','bev_pers_n','bev_dichte_pha','egid_int'];
 let rows='';
 for(const k of keys){const v=p[k]; if(v!==undefined&&v!==null&&v!==''){rows+=`<tr><td><b>${k}</b></td><td>${v}</td></tr>`;}}
 return `<table>${rows}</table>`;
}
fetch('assets/points3d.json').then(r=>r.json()).then(data=>{
 for(const rec of data){
  const [x,y,z]=rec.pos;
  const m=new THREE.Mesh(sGeom,sMat.clone());
  m.position.set(x,y,z);
  m.userData=rec.props;
  group.add(m); spheres.push(m);
 }
});
const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();
function click(e){
 const rect=renderer.domElement.getBoundingClientRect();
 mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-(((e.clientY-rect.top)/rect.height)*2-1);
 ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(spheres,false);
 if(hits.length){
  const p=hits[0].object.userData;
  popup.innerHTML='<h3 style="margin:0 0 8px 0">Info</h3>'+makeTable(p);
  popup.style.display='block';
 }
}
renderer.domElement.addEventListener('click',click);
let vis=true;document.getElementById('toggleS').addEventListener('click',()=>{vis=!vis;group.visible=vis;document.getElementById('toggleS').textContent=vis?'Kugeln ausblenden':'Kugeln einblenden';});
document.getElementById('closeP').addEventListener('click',()=>popup.style.display='none');
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
(function anim(){controls.update();renderer.render(scene,camera);requestAnimationFrame(anim);})();
</script></body></html>
